permissions:
    # --- Médias ---
    MEDIA_VIEW:
        roles: [ ROLE_ADMIN ]
        description: "Voir la bibliothèque de médias"

    MEDIA_UPLOAD:
        roles: [ ROLE_ADMIN ]
